# Target models. The runner reads everything it records in runs.csv (provider, model_version,
# api_version, snapshot date) from here — fill in official values before a real call; TBD is refused.
# API keys: only the NAME of an environment variable goes here; put the value in .env (git/log excluded).
# allow_reasoning (default false): thinking is off by protocol, so any reasoning output (separate field or
# reasoning tokens) is recorded as error/REASONING_LEAK. A <think> tag in the reply text is a leak regardless.
models:
  - model_id: mock
    client: mock
    provider: mock
    model_version: mock-0.1
    api_version: none
    model_snapshot_date: "2026-09-30"

  # Fault-injection mock for error-path checks: MT3 item KYAB-900012 times out on turn 2.
  - model_id: mock_faults
    client: mock
    provider: mock
    model_version: mock-0.1
    api_version: none
    model_snapshot_date: "2026-09-30"
    faults: {2: timeout}
    fault_items: [KYAB-900012]

  # --- commercial models of the main evaluation (decided 2026-10-22: GPT-6 Luna + GPT-5 mini) --------------
  # Not called yet: needs OPENAI_API_KEY in .env (key pending). First call = smoke test, then cost re-estimate
  # from call_metrics.csv (scripts/estimate_cost.py).
  - model_id: gpt_6_luna
    # reasoning_effort "none" is what lets temperature/top_p be sent (OpenAI latest-model guide, 2026-09-30).
    client: openai_compatible
    provider: openai
    model_version: gpt-6-luna (alias; OpenAI lists no dated snapshot — record run date)
    model_snapshot_date: "2026-10-01"
    api_version: openai chat-completions v1
    base_url: https://api.openai.com/v1
    request_model: gpt-6-luna
    api_key_env: OPENAI_API_KEY
    max_tokens_param: max_completion_tokens
    timeout_s: 120
    extra_body: {reasoning_effort: none, store: false}

  - model_id: gpt_5_mini
    # GPT-5 mini cannot turn reasoning off (lowest effort: minimal) and accepts only the default temperature/top_p
    # (1) → those two are not sent (omit_params) and the provider default 1.0 applies, which equals the run
    # config's temperature 1.0 / top_p 1.0. Reasoning tokens are expected (allow_reasoning) and count against
    # max_completion_tokens (8192); call_metrics.csv records them. Verify both settings on the first call.
    client: openai_compatible
    provider: openai
    model_version: gpt-5-mini-2025-08-07 (dated snapshot)
    model_snapshot_date: "2025-08-07"
    api_version: openai chat-completions v1
    base_url: https://api.openai.com/v1
    request_model: gpt-5-mini-2025-08-07
    api_key_env: OPENAI_API_KEY
    max_tokens_param: max_completion_tokens
    timeout_s: 300
    allow_reasoning: true
    omit_params: [temperature, top_p]
    extra_body: {reasoning_effort: minimal, store: false}

  - model_id: local_qwen3_8b
    # Exploratory live pilot local model (served by scripts/serve_qwen3_8b.sh). Not a final-5 candidate size.
    client: openai_compatible
    provider: local-vllm
    model_version: Qwen/Qwen3-8B@b968826d9c46dd6066d109eabc6255188de91218 (bf16)
    model_snapshot_date: "2026-10-01"
    api_version: vllm-0.11.0 openai-chat-completions-v1 (generation-config=vllm, seed=0)
    base_url: http://127.0.0.1:8310/v1
    request_model: Qwen/Qwen3-8B
    timeout_s: 300
    extra_body: {chat_template_kwargs: {enable_thinking: false}}   # thinking off (protocol decision pending)

  - model_id: local_qwen3_32b_fp8
    # Exploratory live pilot, second local model (served by scripts/serve_qwen3_32b_fp8.sh). Same family as
    # local_qwen3_8b → a model-size comparison, not a cross-provider comparison.
    client: openai_compatible
    provider: local-vllm
    model_version: Qwen/Qwen3-32B-FP8@aa55da1ecc13d006e8b8e4f54579b1ea8c3db2df (fp8 e4m3 block-128 weights, bf16 activations)
    model_snapshot_date: "2026-10-01"
    api_version: vllm-0.11.0 openai-chat-completions-v1 (generation-config=vllm, seed=0, max-model-len=32768, max-num-seqs=16)
    base_url: http://127.0.0.1:8311/v1
    request_model: Qwen/Qwen3-32B-FP8
    timeout_s: 300
    extra_body: {chat_template_kwargs: {enable_thinking: false}}   # thinking off, same as local_qwen3_8b
