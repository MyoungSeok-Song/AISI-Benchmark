# 원천 데이터셋 등록부 — 납품 sources.json의 version·location을 채우는 근거.
#
# 내보내기(kyab_runner.export)는 프로젝트 data/ 아래 local_file의 sha256이 여기 적힌 sha256과 같을 때만
# version(=hf_commit)과 location(HF 저장소·커밋·파일이 모두 보이는 URL)을 채운다. 다르거나 파일이 없으면
# 빈칸 + TODO로 두고 경고를 낸다. 값은 코드에 박지 않고 여기서만 관리한다.
#
# acquired_at(취득일)은 근거가 없어 적지 않는다(TODO로 남음). NEW(자체 작성 문항)는 원천이 없어 등록하지 않는다.
# 근거: 팀원 파일럿 manifest(2026-10-06, 사용자 제공)의 hf_repo·hf_commit·sha256. 내부 검토에서 우리
# data/ 파일의 sha256과 같음을 확인(2026-10-06). 파일럿의 selection_rule(문항 선택 규칙)은 그쪽 개발 샘플
# 규칙이라 가져오지 않는다.
sources:
  CAREBench:
    local_file: CAREBench_prompts_500.csv          # 프로젝트 data/ 아래 파일 이름
    hf_repo: handshake-ai-research/CAREBench
    hf_commit: deb54e5817484f88855b7f976457744066092ca4
    hf_file: prompts.csv                           # 저장소 안에서 local_file에 해당하는 파일
    sha256: 58ea1cfe73e41e5742e924cb8eb2027ef735935b78ce3430b30928110d40ea54
    basis: "팀원 파일럿 manifest 2026-10-06(사용자 제공). data/CAREBench_prompts_500.csv sha256 일치 확인(내부 검토 2026-10-06)"
  MinorBench:
    local_file: MinorBench_original_299.csv
    hf_repo: govtech/MinorBench
    hf_commit: 6ba1537bfc3bd458b3111546859ae850720108ce
    hf_file: test.csv
    sha256: 64b6fbfe5380228916dff5781857d2d9d9c3f7b333001867691db9be3f76812c
    basis: "팀원 파일럿 manifest 2026-10-06(사용자 제공). data/MinorBench_original_299.csv sha256 일치 확인(내부 검토 2026-10-06)"
