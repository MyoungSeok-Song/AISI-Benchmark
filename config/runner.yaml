# 러너 공통 설정
# 코드북이 값을 정해 두지 않은 규칙의 기본값을 모아 둔다. 결정이 나면 이 파일만 고친다.
# (근거: 계획_실행코드·구조검토_v0.2.md §3, 내부 검토 2026-09-30 전달 기본값)

# ── 모델 호출 파라미터 (04_runs: temperature 0.0 · top_p 1.0 고정) ───────
# max_output_tokens 8192: 코드북 담당 회신(2026-10-05) ① "출력 한도 상향(긴 응답이 잘려 상담 안내 누락으로 판정되는 것 방지)"의
#   값은 사용자(연구실 A) 결정 2026-10-05. 수행계획서 v1.1 표 Ⅳ-20의 "1,024 토큰 전 모델 동일 고정"과 다르므로 변경 기록이 필요하다.
#   코드북 04 형식 원문은 아직 "1024로 고정"이고 overlay OV-R1005-1이 허용값을 [8192]로 바꾼다.
#   이 값을 바꾸면 models.yaml 로컬 모델의 server.max_model_len도 함께 봐야 한다(vLLM 0.30: 입력 상한 = max_model_len − max_tokens).
#   실행기는 시작 전에 코드북 허용값과 서버 길이를 점검하고(cli.check_run_params·check_context_budget) 어긋나면 폴더를 만들지 않고 멈춘다.
run_params:
  temperature: 0.0
  top_p: 1.0
  max_output_tokens: 8192

# ── 로컬 서버 길이 사전 점검의 여유분 ────────────────────────────────────
# 조건: max_model_len − max_output_tokens ≥ (planned_round_count − 1) × max_output_tokens + context_reserve_tokens
# (앞 턴 응답이 모두 한도까지 길 때도 마지막 턴 입력이 들어가야 한다. 여유분은 시스템 프롬프트·발화·템플릿 몫)
context_reserve_tokens: 1024

# ── 04_runs 등록값 (코드북: service_default 또는 등록 설정명 / none 또는 등록 프로필) ──
safety_profile: service_default
tool_profile: none
registered_safety_profiles: [service_default]
registered_tool_profiles: [none]

# ── 시스템 프롬프트 (C1: 안전 지시 없는 중립 1문장, 모든 실행 동일) ────
system_prompt_file: system_prompt.txt

# ── 프로토콜 정의 (01 conversation_mode·planned_round_count와의 짝) ────
# MT7·MT10은 턴 수만 다른 같은 규칙이다.
protocols:
  ST1-1.0.0:  {conversation_mode: single, planned_round_count: 1}
  MT3-1.0.0:  {conversation_mode: multi,  planned_round_count: 3}
  MT7-1.0.0:  {conversation_mode: multi,  planned_round_count: 7}
  MT10-1.0.0: {conversation_mode: multi,  planned_round_count: 10}

# ── 반복 횟수 (04 rollout_no 허용값 1·2·3) ─────────────────────────────
default_rollouts: 3

# ── context_text 전달 위치 (C2) ────────────────────────────────────────
# user_prefix: 해당 턴 user 메시지 앞에 붙인다. 구분 문자열은 아래 값.
context_position: user_prefix
context_separator: "\n\n"

# ── 실패 처리 (C4) ─────────────────────────────────────────────────────
# 일시 오류(어댑터가 retryable로 표시한 error·timeout)는 같은 턴을 다시 시도한다.
# 재시도 내역은 CSV가 아니라 runner_events.jsonl에 남는다.
max_attempts_per_turn: 3
# 한 턴이 끝내 성공하지 못하면 그 실행을 멈춘다. 성공 턴이 0이면 failed, 1 이상이면 partial.

# ── 실행 자격 (01 item_review_status·lifecycle_status) ─────────────────
# 아래 값이 아닌 문항은 --allow-unverified를 줘야 실행된다(개발 샘플용).
eligible_item_review_status: [verified, revised]
eligible_lifecycle_status: [active]

# ── 대조 문항의 위험군 연결 (02 control_target_risk, overlay OV-P4 잠정) ─────
# 대조 문항(safe_control)의 current 태그에 값이 없으면 경고만 내고 실행한다(집계에서 그 문항은 위험군 행에 빠진다).
# true로 바꾸면 오류가 되어 실행이 막힌다. 분류팀 02에 이 칸이 다 채워진 뒤에 켤 것.
control_link_required: false

# ── 등록 코드 (코드북: "승인된 식별자만 허용". 정식 목록이 오기 전 임시) ──
registered_rubric_ids: [RB-6D-v1]

# ── 05 finish_reason 정규화 어휘 (코드북: "공급자 값을 정규화한 통제어휘") ──
finish_reasons: [stop, length, content_filter, tool_calls, other]

# ── 시각 표기 (C11) ────────────────────────────────────────────────────
timezone: Asia/Seoul

# ── 로컬 vLLM 서버용 venv (tools/vllm_server.py) ───────────────────────
# 경로에 공백이 있으면 안 된다(FlashInfer 커널 빌드 실패). 그래서 러너 폴더 밖에 둔다.
vllm_venv: /home/ubuntu/342/myoungseok/.venvs/etri-vllm

# ── 로컬 모델 가중치 캐시 (HF_HOME) ────────────────────────────────────
# 홈 디렉터리(~/.cache)는 워크로드 재시작 때 지워진다(2026-10-02 재시작으로 Qwen 가중치 소실).
# 그래서 영구 디스크(/home/ubuntu/342, NFS)에 둔다. 환경변수 HF_HOME이 있으면 그쪽이 우선이다.
hf_home: /home/ubuntu/342/myoungseok/.cache/huggingface

# ── vLLM 서버 프로세스에 줄 환경변수 ────────────────────────────────────
# VLLM_USE_FLASHINFER_SAMPLER=0: vLLM은 기동 때 FlashInfer top-k/top-p 샘플러를 예열하며 커널을 nvcc로
#   빌드하는데, 이 서버에서는 빌드할 수 없다(시스템 nvcc 12.3은 FlashInfer 0.6.18의 '--compress-mode' 옵션을
#   모르고, venv의 CUDA 13 묶음은 nvcc 13.4·헤더 13.0으로 버전이 어긋난다). 러너는 temperature 0(greedy,
#   argmax)만 쓰므로 vLLM 기본(PyTorch) 샘플러로 바꿔도 출력은 같다. (2026-10-02 재시작 뒤 확인)
# FLASHINFER_WORKSPACE_BASE·VLLM_CACHE_ROOT: 빌드한 커널과 torch.compile 결과를 영구 디스크에 둔다
#   (기본값 ~/.cache는 재시작 때 지워진다).
vllm_env:
  VLLM_USE_FLASHINFER_SAMPLER: "0"
  FLASHINFER_WORKSPACE_BASE: /home/ubuntu/342/myoungseok
  VLLM_CACHE_ROOT: /home/ubuntu/342/myoungseok/.cache/vllm
