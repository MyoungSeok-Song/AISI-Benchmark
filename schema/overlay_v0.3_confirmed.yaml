# 코드북 v0.2 추출본(kyab_runner/spec/codebook_data.py, 자동 생성) 위에 덮어쓰는 변경 목록
#
# 왜 필요한가
#   코드북 xlsx가 유일한 명세인데, v0.3 xlsx가 오기 전에 이미 확정된 변경이 있다.
#   생성 모듈을 손으로 고치면 xlsx와 어긋나므로, 변경만 이 파일에 따로 적고
#   kyab_runner/codebook.py가 읽을 때 덮어쓴다. 이 파일은 사람이 쓰므로 yaml로 둔다(사용자 결정 2026-10-07).
#
# 언제 지우는가
#   코드북 v0.3 xlsx 수령 → tools/extract_codebook.py 재실행 → 이 파일 삭제.
#   (v0.3에 반영되지 않은 항목이 있으면 그 항목만 남기고 status를 다시 확인한다)
#
# status
#   confirmed    코드북 담당 회신으로 확정된 사항. 회신 날짜별로 ID를 붙인다:
#                  OV-C*       2026-09-30 회신 1~5
#                  OV-R1005-*  2026-10-05 회신 ①~④
#                basis에 회신 원문 요지를 적는다. 회신이 정하지 않은 값(예: 한도 8,192)은 출처를 따로 적는다.
#   provisional  아직 결정 전. 러너가 돌아가려면 값이 필요해 우리가 둔 가정(이름·위치·값 규칙·조합 해석 등).
#                basis에 '잠정'을 밝힌다. 다음 회신·v0.3 xlsx에 따라 바뀔 수 있다.
#
# 항목마다 쓸 수 있는 키
#   apply        있는 필드의 변경 목록. 항목마다 table, field (필수) + 아래 중 필요한 것
#     enum         허용값 전체 교체
#     enum_add     허용값 추가
#     enum_from    분류체계 JSON에서 허용값을 가져옴: taxonomy.major | taxonomy.sub
#     enum_kind    scalar(단일값) | array(JSON 배열의 원소)
#     required     true | false  (false = 빈 값 허용. 조건부 필수는 validate.py·judge_io.py의 규칙이 검사)
#     max_items    JSON 배열의 최대 원소 수
#     format       '들어갈 수 있는 값·형식' 원문 덮어쓰기
#     none_token   '해당 없음'을 뜻하는 기록값 (예: critical_failure_code의 NONE)
#   add_field    새 필드 목록. table, field, after(이 필드 바로 뒤에 넣음), stage, format (필수),
#                ai_delivery, enum/enum_from/enum_kind, required, regex (선택),
#                authorized_by (필수: 열 추가를 확정한 confirmed 항목의 ID. 없으면 로드가 거부된다 —
#                코드북 담당 회신 없이는 열을 늘릴 수 없다는 프로젝트 규칙의 코드 쪽 가드)
#   note         매니페스트(codebook_overlays)에 함께 남는 설명. 잠정 표시는 여기와 basis에 적는다.

base: codebook_v0.2.json

changes:
  # ── 확정 사항 ────────────────────────────────────────────────────────
  - id: OV-C1
    status: confirmed
    date: 2026-09-30
    basis: "코드북 담당 회신 1: protocol_id 표기를 MT3-1.0.0 형식으로 통일 (참고 시트 2절 '실행 방식' 행과 같은 형식)"
    note: "회신은 ST1·MT3만 예로 들었다. MT7·MT10도 같은 형식으로 바꾼 것은 가정."
    apply:
      - {table: 01_items, field: protocol_id, enum: [ST1-1.0.0, MT3-1.0.0, MT7-1.0.0, MT10-1.0.0]}
      - {table: 04_runs,  field: protocol_id, enum: [ST1-1.0.0, MT3-1.0.0, MT7-1.0.0, MT10-1.0.0]}

  - id: OV-C2
    status: confirmed
    date: 2026-09-30
    basis: "코드북 담당 회신 2: intent_tag는 선택 필드. 비워도 되고 집계에 쓰지 않음"
    apply:
      - {table: 02_item_tags, field: intent_tag, required: false}

  # 회신 3(기대 안전응답 = 02 expected_response_tags + 03 turn_expected_safe_response_json)은
  # 설명 문구 정정이라 덮어쓸 값이 없다. 러너는 두 필드 모두 모델에 보내지 않는다(AI 전달 ×).

  - id: OV-C4a
    status: confirmed
    date: 2026-09-30
    basis: "코드북 담당 회신 4: original_text는 외부 원천을 번역·한국화한 경우만 필수, 신규 문항은 공란 허용"
    note: "조건 검사는 validate.py rule_original_text (source_benchmark가 NEW가 아니면 필수)"
    apply:
      - {table: 01_items, field: original_text, required: false}

  - id: OV-C4b
    status: confirmed
    date: 2026-09-30
    basis: "코드북 담당 회신 4: primary_risk는 위험 문항이 검토 완료된 경우만 필수. 안전 대조군·미검토·보류는 공란 허용, risk_review_status로 이유 구분. not_applicable 추가"
    note: "조건 검사는 validate.py rule_primary_risk (risk_review_status=mapped이면 필수)"
    apply:
      - {table: 02_item_tags, field: primary_risk, required: false}
      - {table: 02_item_tags, field: risk_review_status, enum_add: [not_applicable]}

  - id: OV-C5
    status: confirmed
    date: 2026-09-30
    basis: "코드북 담당 회신 5: R1~R5 + M01~M05 → A1~A10 단일 분류체계(상위 10 · 하위 39). 코드는 schema/taxonomy_A1-A10.json에서 읽는다"
    note: "taxonomy_version의 MAJOR가 0인 과거 행은 validate.py가 이전 코드(crosswalk_RM_to_A.csv)로 검사한다."
    apply:
      - {table: 02_item_tags, field: primary_risk,    enum_from: taxonomy.major, enum_kind: scalar}
      - {table: 02_item_tags, field: secondary_risks, enum_from: taxonomy.major, enum_kind: array}
      - {table: 02_item_tags, field: sub_risk_codes,  enum_from: taxonomy.sub,   enum_kind: array}

  # ── 가정 (결정 전) ───────────────────────────────────────────────────
  - id: OV-P1
    status: provisional
    date: 2026-09-30
    basis: "잠정: 검토메모 §3 A안: sub_risk_codes에는 주소분류만 0~1개. 분류팀 작업안내 B7·B18(주대분류 1 + 주소분류 1)"
    apply:
      - {table: 02_item_tags, field: sub_risk_codes, max_items: 1}

  - id: OV-P2
    status: provisional
    date: 2026-09-30
    basis: "잠정: 검토메모 §6: M01~M05가 A6~A10으로 편입돼 m_review_status에 넣을 값이 없음 → 필수 해제"
    note: "validate.py rule_m_review: taxonomy_version MAJOR가 1 이상인 행은 m_review_* 공란, 0인 행은 v0.2대로 필수"
    apply:
      - {table: 02_item_tags, field: m_review_status, required: false}

  - id: OV-P3
    status: provisional
    date: 2026-09-30
    basis: "잠정: 계획 문서 §1.7: 차단·오류·시간초과·빈 응답이면 응답 본문이 없다. v0.2는 response_text를 무조건 필수로 적고 있음"
    note: "csv_io가 response_status=success인 행에만 본문을 요구한다."
    apply:
      - {table: 05_responses, field: response_text, required: false}

  # ── 2026-10-05 회신 (코드북 담당, 사용자 전달) 확정 4건 + 그 세부 잠정안. 판정(06) 가정 J1b·J3·J4의 조건·값은 config/aggregation_rules.yaml ──
  - id: OV-R1005-1
    status: confirmed
    date: 2026-10-05
    basis: "방향: 코드북 담당 회신(2026-10-05) ① 출력 한도 상향(긴 응답이 잘려 상담 안내 누락으로 판정되는 것 방지). 값 8,192: 사용자(연구실 A) 결정 2026-10-05 — 코드북 담당께 통보·v0.3 반영 요청"
    note: "수행계획서 v1.1 표 Ⅳ-20 '1,024 전 모델 동일 고정'과 다름 → 변경 기록 필요. 코드북 04 형식 원문('1024로 고정')에 enum이 없어 이 overlay가 허용값을 정한다. v0.3에 enum이 생길 때까지 유지. 실행기는 시작 전에 run_params를 이 허용값으로 점검한다(cli.check_run_params)"
    apply:
      - {table: 04_runs, field: max_output_tokens, enum: [8192]}

  - id: OV-R1005-3
    status: confirmed
    date: 2026-10-05
    basis: "코드북 담당 회신(2026-10-05) ③: 치명적 실패가 없는 경우에는 빈칸 대신 NONE으로 기록(빈칸은 미채점·누락과 구분이 어려움). 코드북 08 미확정 C5·과제 5 가정 J1(빈값)을 대체"
    note: "NONE 값의 출처는 이 항목 하나(none_token). 판정이 끝난 행(completed·adjudicated)은 NONE 또는 승인 코드가 필수이고 빈칸은 오류 — judge_io.py rule_outcome_required·rule_cfc"
    apply:
      - {table: 06_judgments, field: critical_failure_code,
         format: "승인된 CFC 코드 또는 NONE(치명적 실패 없음)",
         none_token: NONE}

  - id: OV-R1005-4
    status: confirmed
    date: 2026-10-05
    basis: "코드북 담당 회신(2026-10-05) ④: inconclusive(판단 보류)는 허용하되, 실패율 계산에서 제외한 경우에는 판단 보류 건수·비율과 해당 지표의 분모를 함께 제시(보류가 많은 모델이 실제보다 좋게 보이지 않도록)"
    note: "07 열 추가 없음(승인되지 않음). 제시는 RESULTS 폴더의 results_denominators.csv와 results_notes.json — 파일 형식·D/I/U/other·보류율 정의는 잠정(aggregation_rules.yaml inconclusive_report, 지표 명세 전). 코드북 08 미확정 C6을 대체"
