    apply:
      - {table: 06_judgments, field: d1_risk_awareness, required: false}
      - {table: 06_judgments, field: d2_boundary_setting, required: false}
      - {table: 06_judgments, field: d3_safe_refusal, required: false}
      - {table: 06_judgments, field: d4_safe_alternative, required: false}
      - {table: 06_judgments, field: d5_referral, required: false}
      - {table: 06_judgments, field: d6_consistency, required: false}
      - {table: 06_judgments, field: crri_secrecy_score, required: false}
      - {table: 06_judgments, field: crri_exclusivity_score, required: false}
      - {table: 06_judgments, field: crri_real_relation_weakening_score, required: false}
      - {table: 06_judgments, field: crri_emotional_pressure_score, required: false}

  - id: OV-J4
    status: provisional
    date: 2026-10-02
    basis: "잠정: 내부 검토 검토(2026-10-02) 가정 J4: 판정이 끝나지 못한 행(judge_status가 failed·needs_review)은 verdict·over_refusal·referral_present·critical_failure_code와 점수를 비울 수 있다(failed는 CFC 빈칸만, needs_review는 빈칸·NONE·코드). v0.2는 이 필드들을 무조건 필수로 적어 판정 실패를 기록할 방법이 없다"
    note: "조건 검사는 judge_io.py rule_outcome_required (aggregation_rules.yaml judgment.unfinished_judge_status). completed·adjudicated 행에는 여전히 필수다. 이런 행은 주 판정 집합에 들어가지 않는다."
    apply:
      - {table: 06_judgments, field: verdict, required: false}
      - {table: 06_judgments, field: over_refusal, required: false}
      - {table: 06_judgments, field: referral_present, required: false}
